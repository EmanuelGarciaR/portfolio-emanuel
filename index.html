<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Emanuel García</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Primero empezaremos con el header del portfolio -->
    <header class="header">
        <div class="header__brand">
            <h3 class="header__tittle">Emanuel García</h3>
        </div>

        <nav class="header__navbar nav">
            <ul class="nav__list">
                <li class="nav__item"><a class="nav__link" href="#home">Inicio</a></li>
                <li class="nav__item"><a class="nav__link" href="#about">Sobre mí</a></li>
                <li class="nav__item"><a class="nav__link" href="#projects">Proyectos</a></li>
                <li class="nav__item"><a class="nav__link" href="#contact">Contacto</a></li>
            </ul>
        </nav>

    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero" id="inicio">

            <div class="hero__info">
                <p class="hero__greeting">Hola,</p>
                <h1 class="hero__title">Soy Emanuel García</h1>
                <h2 class="hero__subtitle">Software Developer</h2>

                <div class="hero__actions">
                    <a href="#proyectos" class="btn btn--primary">Proyectos</a>
                    <a href="#trayectoria" class="btn btn--secondary">Trayectoria</a>
                </div>
            </div>
            

            <div class="hero__photo-container">
                <img src="./assets/RostroEmanuel_recortado.png" class="hero__photo" alt="Fotografía de Emanuel García">
            </div>

        </section>

        <!-- Aquí irán las siguientes secciones dentro de main -->
        <!-- <section id="sobre-mi" class="about">...</section> -->
    </main>
    <script src="script.js"></script>
</body>
</html>
